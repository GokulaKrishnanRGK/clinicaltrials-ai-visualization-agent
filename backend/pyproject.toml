[project]
name = "clinical-trials-backend"
version = "0.1.0"
description = "FastAPI backend for ClinicalTrials.gov query-to-visualization agent"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.24",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.4",
    "litellm>=1.87.1",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.3",
    "sse-starlette>=3.4.4",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "tqdm>=4.68.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
